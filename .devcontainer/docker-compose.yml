services:
  db:
    container_name: django_app_db
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .devcontainer/.env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .devcontainer/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .devcontainer/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    container_name: django_app_web
    build:
      context: .
      dockerfile: ../Dockerfile.dev
    volumes:
      - ..:/workspace:cached
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_ENV: dev
      DJANGO_DEBUG: "True"
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,*
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

volumes:
  pgdata:
