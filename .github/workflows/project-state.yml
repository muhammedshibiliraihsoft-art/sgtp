name: Project State Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-project-state:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate repository state
        env:
          DJANGO_ENV: test
          DJANGO_SECRET_KEY: state-validator-test-secret-key-that-is-long-enough
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost
          DJANGO_CORS_ALLOWED_ORIGINS: ""
          DB_NAME: state_validator
          DB_USER: state_validator
          DB_PASSWORD: state_validator
          DB_HOST: localhost
          DB_PORT: "5432"
        run: python scripts/verify_project_state.py

      - name: Test validator logic
        run: python -m pytest scripts/tests -q -p no:cacheprovider
