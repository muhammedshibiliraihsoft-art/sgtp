name: Project State Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-project-state:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: state_validator
          POSTGRES_USER: state_validator
          POSTGRES_PASSWORD: state_validator
        options: >-
          --health-cmd "pg_isready -U state_validator -d state_validator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: test
      DJANGO_SECRET_KEY: state-validator-test-secret-key-that-is-long-enough
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost
      DJANGO_CORS_ALLOWED_ORIGINS: ""
      DB_NAME: state_validator
      DB_USER: state_validator
      DB_PASSWORD: state_validator
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate repository state
        run: python scripts/verify_project_state.py

      - name: Test validator logic
        run: python -m pytest scripts/tests -q -p no:cacheprovider

      - name: Test application suite
        run: python -m pytest -q -p no:cacheprovider --no-cov

      - name: Django system check
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
