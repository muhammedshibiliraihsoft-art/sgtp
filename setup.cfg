[flake8]
max-line-length = 88
exclude = 
    .git,
    __pycache__,
    .venv,
    venv,
    migrations,
    staticfiles,
    node_modules
ignore = 
    E203,
    E501,
    W503

per-file-ignores =
    __init__.py: F401

[isort]
profile = black
multi_line_output = 3
line_length = 88
known_django = django
known_first_party = apps,core
sections = FUTURE,STDLIB,THIRDPARTY,DJANGO,FIRSTPARTY,LOCALFOLDER