  /api/v1/catalog/design-templates/:
    get:
      operationId: catalog_global_design_templates_list
      parameters:
      - in: query
        name: family
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          enum:
          - ACTIVE
          - ARCHIVED
          - all
          type: string
          default: ACTIVE
          minLength: 1
        description: |-
          * `ACTIVE` - ACTIVE
          * `ARCHIVED` - ARCHIVED
          * `all` - all
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
