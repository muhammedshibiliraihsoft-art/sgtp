openapi: 3.0.3
info:
  title: SGTP API
  version: 1.0.0
  description: Supplier-Centric Garment & Tailor Platform API
paths:
  /api/health/live/:
    get:
      operationId: api_health_live_retrieve
      description: |-
        Liveness probe. Lightweight check that the process is alive.
        Returns 200 OK unconditionally.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLiveResponse'
          description: ''
  /api/health/ready/:
    get:
      operationId: api_health_ready_retrieve
      description: |-
        Readiness probe. Verifies database connectivity.
        Returns 200 OK if ready, 503 Service Unavailable on dependency failure.
        Does not expose internal DB details.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailableResponse'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: api_v1_auth_csrf_retrieve
      description: Returns only a CSRF token for credentialed browser clients on an
        explicitly trusted origin; it does not authenticate the caller.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfBootstrapResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: Authenticate using the legacy email/password fields or identifier/password,
        where identifier accepts Login ID and approved legacy aliases. The shared
        password field accepts existing legacy passwords or newer six-digit PINs;
        the system is not PIN-only for existing accounts. Viewer accounts cannot authenticate.
        The response contains an access JWT and user profile; the refresh JWT is set
        only in the HttpOnly cookie.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOrIdentifierLoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailOrIdentifierLoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailOrIdentifierLoginRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      description: Requires a valid access JWT. Blacklist the refresh token when present,
        then clear the refresh and CSRF cookies. A valid CSRF cookie and matching
        X-CSRFToken header are required.
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Masked token from the CSRF bootstrap response.
        required: true
      - in: cookie
        name: refresh
        schema:
          type: string
        description: HttpOnly refresh token cookie to blacklist and clear.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
  /api/v1/auth/pin-reset-requests/:
    post:
      operationId: api_v1_auth_pin_reset_requests_create
      description: Public request only; phone does not verify identity or change a
        PIN. Response does not disclose account eligibility.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopAdminPinResetRequestInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShopAdminPinResetRequestInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShopAdminPinResetRequestInputRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopAdminPinResetRequestResult'
          description: ''
  /api/v1/auth/pin-reset-requests/{request_id}/approve/:
    post:
      operationId: api_v1_auth_pin_reset_requests_approve_create
      description: Main Supplier approval returns a one-time temporary PIN; never
        retrievable later.
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedShopAdminPinReset'
          description: ''
  /api/v1/auth/pin-reset-requests/{request_id}/reject/:
    post:
      operationId: api_v1_auth_pin_reset_requests_reject_create
      description: Main Supplier rejects a pending request without changing credentials.
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectedShopAdminPinReset'
          description: ''
  /api/v1/auth/pin-reset-requests/pending/:
    get:
      operationId: api_v1_auth_pin_reset_requests_pending_list
      description: Main Supplier only. Lists pending Shop ADMIN PIN reset requests.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingShopAdminPinReset'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: api_v1_auth_token_refresh_create
      description: Rotate the refresh token from the HttpOnly cookie. A valid CSRF
        cookie and matching X-CSRFToken header are required. The refresh token is
        never accepted from the request body.
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Masked token from the CSRF bootstrap response.
        required: true
      - in: cookie
        name: refresh
        schema:
          type: string
        description: Refresh token in HttpOnly cookie
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
  /api/v1/auth/users/:
    get:
      operationId: api_v1_auth_users_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: api_v1_auth_users_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreate'
          description: ''
  /api/v1/auth/users/{id}/:
    get:
      operationId: api_v1_auth_users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: api_v1_auth_users_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: api_v1_auth_users_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/users/{id}/reset-credentials/:
    post:
      operationId: api_v1_auth_users_reset_credentials_create
      description: Main Supplier authority remains unchanged. A Shop ADMIN may reset
        only an active STAFF account in the same Shop. Returns a one-time temporary
        PIN.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCredentialResetResponse'
          description: ''
