openapi: 3.0.3
info:
  title: SGTP API
  version: 1.0.0 (v1)
  description: Supplier-Centric Garment & Tailor Platform API
paths:
  /api/health/live/:
    get:
      operationId: api_health_live_retrieve
      description: |-
        Liveness probe. Lightweight check that the process is alive.
        Returns 200 OK unconditionally.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLiveResponse'
          description: ''
  /api/health/ready/:
    get:
      operationId: api_health_ready_retrieve
      description: |-
        Readiness probe. Verifies database connectivity.
        Returns 200 OK if ready, 503 Service Unavailable on dependency failure.
        Does not expose internal DB details.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailableResponse'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: api_v1_auth_csrf_retrieve
      description: Returns only a CSRF token for credentialed browser clients on an
        explicitly trusted origin; it does not authenticate the caller.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfBootstrapResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: Authenticate using the legacy email/password fields or identifier/password,
        where identifier accepts User ID, email, or E.164 phone. The response contains
        an access JWT and user profile; the refresh JWT is set only in the HttpOnly
        cookie.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOrIdentifierLoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailOrIdentifierLoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailOrIdentifierLoginRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      description: Requires a valid access JWT. Blacklist the refresh token when present,
        then clear the refresh and CSRF cookies. A valid CSRF cookie and matching
        X-CSRFToken header are required.
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Masked token from the CSRF bootstrap response.
        required: true
      - in: cookie
        name: refresh
        schema:
          type: string
        description: HttpOnly refresh token cookie to blacklist and clear.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
  /api/v1/auth/password/reset/:
    post:
      operationId: api_v1_auth_password_reset_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequestResponse'
          description: ''
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: api_v1_auth_password_reset_confirm_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmResponse'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: api_v1_auth_token_refresh_create
      description: Rotate the refresh token from the HttpOnly cookie. A valid CSRF
        cookie and matching X-CSRFToken header are required. The refresh token is
        never accepted from the request body.
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Masked token from the CSRF bootstrap response.
        required: true
      - in: cookie
        name: refresh
        schema:
          type: string
        description: Refresh token in HttpOnly cookie
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
  /api/v1/auth/users/:
    get:
      operationId: api_v1_auth_users_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: api_v1_auth_users_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreate'
          description: ''
  /api/v1/auth/users/{id}/:
    get:
      operationId: api_v1_auth_users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: api_v1_auth_users_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: api_v1_auth_users_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/users/{id}/reset-credentials/:
    post:
      operationId: api_v1_auth_users_reset_credentials_create
      description: Main Supplier only. Returns one temporary credential with no-store
        headers.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCredentialResetResponse'
          description: ''
  /api/v1/auth/users/me/:
    get:
      operationId: api_v1_auth_users_me_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/users/password/change/:
    post:
      operationId: api_v1_auth_users_password_change_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/users/update_profile/:
    put:
      operationId: api_v1_auth_users_update_profile_update
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: api_v1_auth_users_update_profile_partial_update
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/memberships/:
    get:
      operationId: api_v1_memberships_list
      description: Manage Shop memberships through the transactional domain service.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - ADMIN
          - STAFF
          - VIEWER
        description: |-
          The user's role within this Shop.

          * `ADMIN` - Shop Admin
          * `STAFF` - Shop Staff
          * `VIEWER` - Shop Viewer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: tenant
        schema:
          type: string
          format: uuid
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTenantMemberList'
          description: ''
    post:
      operationId: api_v1_memberships_create
      description: Manage Shop memberships through the transactional domain service.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantMemberRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TenantMemberRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TenantMemberRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMember'
          description: ''
  /api/v1/memberships/{id}/:
    get:
      operationId: api_v1_memberships_retrieve
      description: Manage Shop memberships through the transactional domain service.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Shop Membership.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMember'
          description: ''
    put:
      operationId: api_v1_memberships_update
      description: Manage Shop memberships through the transactional domain service.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Shop Membership.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantMemberRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TenantMemberRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TenantMemberRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMember'
          description: ''
    patch:
      operationId: api_v1_memberships_partial_update
      description: Manage Shop memberships through the transactional domain service.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Shop Membership.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTenantMemberRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTenantMemberRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTenantMemberRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMember'
          description: ''
    delete:
      operationId: api_v1_memberships_destroy
      description: Manage Shop memberships through the transactional domain service.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Shop Membership.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/memberships/{id}/deactivate/:
    post:
      operationId: api_v1_memberships_deactivate_create
      description: Manage Shop memberships through the transactional domain service.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Shop Membership.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantMemberRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TenantMemberRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TenantMemberRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMember'
          description: ''
  /api/v1/memberships/{id}/reactivate/:
    post:
      operationId: api_v1_memberships_reactivate_create
      description: Manage Shop memberships through the transactional domain service.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Shop Membership.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantMemberRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TenantMemberRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TenantMemberRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMember'
          description: ''
  /api/v1/memberships/{id}/undo_remove/:
    post:
      operationId: api_v1_memberships_undo_remove_create
      description: Manage Shop memberships through the transactional domain service.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Shop Membership.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantMemberRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TenantMemberRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TenantMemberRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMember'
          description: ''
  /api/v1/shops/{shop_id}/clients/:
    get:
      operationId: api_v1_shops_clients_list
      description: List only Clients in the explicitly authorized Shop. Results are
        page-number paginated and ordered by name and UUID. Search accepts a Unicode
        name, normalized phone prefix, or exact UUID.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Unicode name, normalized phone prefix, or exact Client UUID.
      - in: path
        name: shop_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientList'
          description: ''
    post:
      operationId: api_v1_shops_clients_create
      description: Create a Client in the selected Shop. Requires the approved Shop
        write permission; duplicate phone/email matches return warnings and never
        merge records.
      parameters:
      - in: path
        name: shop_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactWriteResponse'
          description: ''
  /api/v1/shops/{shop_id}/clients/{client_id}/related-persons/:
    get:
      operationId: api_v1_shops_clients_related_persons_list
      description: List Related Persons belonging to the URL Client in the selected
        Shop. Results are page-number paginated and ordered by name and UUID; search
        accepts a Unicode name, normalized phone prefix, or UUID.
      parameters:
      - in: path
        name: client_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Unicode name, normalized phone prefix, or exact RelatedPerson
          UUID.
      - in: path
        name: shop_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRelatedPersonList'
          description: ''
    post:
      operationId: api_v1_shops_clients_related_persons_create
      description: Create a Related Person under the selected Shop Client. The Primary
        Client relationship is assigned from the URL and cannot be spoofed in the
        request body.
      parameters:
      - in: path
        name: client_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: shop_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelatedPersonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RelatedPersonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RelatedPersonRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedPersonWriteResponse'
          description: ''
  /api/v1/shops/{shop_id}/clients/{client_id}/related-persons/{id}/:
    get:
      operationId: api_v1_shops_clients_related_persons_retrieve
      description: Retrieve a Related Person beneath the authorized URL Client.
      parameters:
      - in: path
        name: client_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: shop_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedPerson'
          description: ''
    put:
      operationId: api_v1_shops_clients_related_persons_update
      description: Update a Related Person under the authorized URL Client.
      parameters:
      - in: path
        name: client_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: shop_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelatedPersonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RelatedPersonRequest'
          multipart/form-data:
            schema:
