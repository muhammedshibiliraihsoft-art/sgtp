          - $ref: '#/components/schemas/Locale'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        appearance_preference:
          $ref: '#/components/schemas/AppearancePreferenceEnum'
    RefreshResponse:
