      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
          description: ''
    delete:
      operationId: v1_tenants_destroy
      description: |-
        ViewSet for managing tenants.
        Provides CRUD operations for tenant management.
      parameters:
      - in: path
        name: id
        schema:
