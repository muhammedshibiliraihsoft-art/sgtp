        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 100
      required:
      - name
      - slug
    TenantRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Display name of the tenant organization
          maxLength: 100
        slug:
          type: string
          minLength: 1
          description: URL-friendly identifier for the tenant
          pattern: ^[a-z0-9-]+$
          maxLength: 50
        domain:
          type: string
          nullable: true
          description: Custom domain for this tenant (optional)
          maxLength: 253
        is_active:
          type: boolean
          description: Whether this tenant is active and can be accessed
        max_users:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Maximum number of users allowed for this tenant
        contact_email:
          type: string
          format: email
          description: Primary contact email for this tenant
          maxLength: 254
        contact_phone:
          type: string
          description: Primary contact phone for this tenant
          maxLength: 20
        address_line1:
          type: string
          maxLength: 255
        address_line2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 100
      required:
      - name
      - slug
    TenantSummary:
      type: object
      description: Lightweight serializer for tenant lists and references.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Display name of the tenant organization
          maxLength: 100
        slug:
          type: string
          description: URL-friendly identifier for the tenant
          pattern: ^[a-z0-9-]+$
          maxLength: 50
        is_active:
          type: boolean
          description: Whether this tenant is active and can be accessed
        user_count:
          type: integer
          description: |-
            Return the number of users associated with this tenant.
            Placeholder for Phase 1. Real implementation will use TenantMembership in Phase 3.
          readOnly: true
      required:
      - id
      - name
      - slug
      - user_count
