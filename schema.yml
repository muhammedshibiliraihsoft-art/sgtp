components:
  schemas:
    PaginatedTenantSummaryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/TenantSummary'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PatchedTenantRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Display name of the tenant organization
          maxLength: 100
        slug:
          type: string
          minLength: 1
          description: URL-friendly identifier for the tenant
          pattern: ^[a-z0-9-]+$
          maxLength: 50
        domain:
          type: string
          nullable: true
          description: Custom domain for this tenant (optional)
          maxLength: 253
        is_active:
          type: boolean
          description: Whether this tenant is active and can be accessed
        max_users:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Maximum number of users allowed for this tenant
        contact_email:
          type: string
          format: email
          description: Primary contact email for this tenant
          maxLength: 254
        contact_phone:
          type: string
          description: Primary contact phone for this tenant
          maxLength: 20
        address_line1:
          type: string
          maxLength: 255
        address_line2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 100
    PatchedUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        first_name:
          type: string
          maxLength: 30
        last_name:
          type: string
          maxLength: 30
        is_active:
          type: boolean
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Display name of the tenant organization
          maxLength: 100
        slug:
          type: string
          description: URL-friendly identifier for the tenant
          pattern: ^[a-z0-9-]+$
          maxLength: 50
        domain:
          type: string
          nullable: true
          description: Custom domain for this tenant (optional)
          maxLength: 253
        is_active:
          type: boolean
          description: Whether this tenant is active and can be accessed
        max_users:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Maximum number of users allowed for this tenant
        user_count:
          type: integer
          description: |-
            Return the number of users associated with this tenant.
            Placeholder for Phase 1. Real implementation will use TenantMembership in Phase 3.
          readOnly: true
        is_at_user_limit:
          type: boolean
          description: Check if tenant has reached its user limit.
          readOnly: true
        contact_email:
          type: string
          format: email
          description: Primary contact email for this tenant
          maxLength: 254
        contact_phone:
          type: string
          description: Primary contact phone for this tenant
          maxLength: 20
        address_line1:
          type: string
          maxLength: 255
        address_line2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_at_user_limit
      - name
      - slug
      - updated_at
      - user_count
    TenantCreate:
      type: object
      description: Serializer for creating tenants with required fields.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Display name of the tenant organization
          maxLength: 100
        slug:
          type: string
          description: URL-friendly identifier for the tenant
          pattern: ^[a-z0-9-]+$
          maxLength: 50
        domain:
          type: string
          nullable: true
          description: Custom domain for this tenant (optional)
          maxLength: 253
        is_active:
          type: boolean
          description: Whether this tenant is active and can be accessed
        max_users:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Maximum number of users allowed for this tenant
        user_count:
          type: integer
          description: |-
            Return the number of users associated with this tenant.
            Placeholder for Phase 1. Real implementation will use TenantMembership in Phase 3.
          readOnly: true
        is_at_user_limit:
          type: boolean
          description: Check if tenant has reached its user limit.
          readOnly: true
        contact_email:
          type: string
          format: email
          description: Primary contact email for this tenant
          maxLength: 254
        contact_phone:
          type: string
          description: Primary contact phone for this tenant
          maxLength: 20
        address_line1:
          type: string
          maxLength: 255
        address_line2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_at_user_limit
      - name
      - slug
      - updated_at
      - user_count
    TenantCreateRequest:
      type: object
      description: Serializer for creating tenants with required fields.
      properties:
        name:
          type: string
          minLength: 1
          description: Display name of the tenant organization
          maxLength: 100
        slug:
          type: string
          minLength: 1
          description: URL-friendly identifier for the tenant
          pattern: ^[a-z0-9-]+$
          maxLength: 50
        domain:
