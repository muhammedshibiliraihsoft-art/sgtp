components:
  schemas:
    AdminCredentialResetResponse:
      type: object
      properties:
        user_code:
          type: string
        temporary_password:
          type: string
      required:
      - temporary_password
      - user_code
    AppearancePreferenceEnum:
      enum:
      - system
      - light
      - dark
      type: string
      description: |-
        * `system` - System
        * `light` - Light
        * `dark` - Dark
    BlankEnum:
      enum:
      - ''
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 40
        phone_normalized:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - phone_normalized
      - updated_at
    ClientRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 40
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - name
    CodeEnum:
      enum:
      - possible_duplicate
      type: string
      description: '* `possible_duplicate` - possible_duplicate'
    ContactWriteResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        phone_normalized:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/DuplicateWarning'
      required:
      - created_at
      - email
      - id
      - name
      - phone
      - phone_normalized
      - updated_at
      - warnings
    CsrfBootstrapResponse:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    DuplicateMatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    DuplicateWarning:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/CodeEnum'
        field:
          $ref: '#/components/schemas/FieldEnum'
        matches:
          type: array
          items:
            $ref: '#/components/schemas/DuplicateMatch'
      required:
      - code
      - field
      - matches
    EmailOrIdentifierLoginRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
    FieldEnum:
      enum:
      - phone
      - email
      type: string
      description: |-
        * `phone` - phone
        * `email` - email
    FirstShopAdmin:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 30
        last_name:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
        phone:
          type: string
      required:
      - email
      - first_name
      - phone
    FirstShopAdminRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 30
        last_name:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
          minLength: 1
      required:
      - email
      - first_name
      - phone
    FunctionsEnum:
      enum:
      - SALES
      - MEASUREMENT
      - CUTTING
      - STITCHING
      - FINISHING
      - QC
      - CASHIER
      type: string
      description: |-
        * `SALES` - Sales
        * `MEASUREMENT` - Measurement
        * `CUTTING` - Cutting
        * `STITCHING` - Stitching
        * `FINISHING` - Finishing
        * `QC` - Quality control
        * `CASHIER` - Cashier
    HealthLiveResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    HealthReadyResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    HealthUnavailableResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Locale:
      enum:
      - en
      - ar-KW
      - bn
      - ur
      type: string
      description: |-
        * `en` - English
        * `ar-KW` - Arabic (Kuwait)
        * `bn` - Bangla
        * `ur` - Urdu
    LoginResponse:
      type: object
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - user
    LogoutResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    MembershipWorkFunctionSetRequest:
      type: object
      properties:
        functions:
          type: array
          items:
            $ref: '#/components/schemas/FunctionsEnum'
          maxItems: 7
      required:
      - functions
    MembershipWorkFunctionSetResponse:
      type: object
      properties:
        membership_id:
          type: string
          format: uuid
          readOnly: true
        shop_id:
          type: string
          format: uuid
          readOnly: true
        functions:
          type: array
          items:
            $ref: '#/components/schemas/FunctionsEnum'
          readOnly: true
      required:
      - functions
      - membership_id
      - shop_id
    NullEnum:
      enum:
      - null
    PaginatedClientList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Client'
    PaginatedRelatedPersonList:
