services:
  - type: web
    name: birky-staging-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: staging
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "commit"
    healthCheckPath: /api/health/ready/
    envVars:
      - key: DJANGO_ENV
        value: staging
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: api-staging.birky.com
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://staging.birky.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://staging.birky.com
      - key: AUTH_TRUSTED_CLIENT_IP_HEADER
        value: HTTP_CF_CONNECTING_IP
      - key: DATABASE_URL
        fromDatabase:
          name: birky-staging-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: birky-staging-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: birky-staging-db
          property: port
      - key: DB_WAIT_TIMEOUT_SECONDS
        value: "60"
      - key: GUNICORN_THREADS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.dummy.EmailBackend
      - key: DEFAULT_FROM_EMAIL
        value: noreply@staging.birky.com
      - key: R2_BUCKET_NAME
        value: birkos-staging-private
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_REGION
        value: auto

databases:
  - name: birky-staging-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "15"
    databaseName: sgtp_staging
    user: sgtp_staging
    ipAllowList: []
